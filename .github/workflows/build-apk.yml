name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME}"
          java -version

          VERSION_OUTPUT="$(java -version 2>&1)"
          RAW_VERSION="$(echo "$VERSION_OUTPUT" | sed -nE 's/.*version "([^"]+)".*/\1/p' | head -n 1)"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect active Java version from: $VERSION_OUTPUT"
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f1)"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but found Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool not found at ${KEYTOOL_BIN}."
            exit 1
          fi

          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore does not exist or is empty after generation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Debug APK at ${APK_PATH} is empty."
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::Selected file ${APK_PATH} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${APK_PATH} ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing or empty at ${SOURCE_APK}."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_TMP_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_TMP_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on the runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared APK release asset is missing or invalid; skipping release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")"
          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Artifact Filename:** ${ASSET_NAME}

          > **Testing Only:** This APK is intended for testing and is **not** a Google Play Store production release. It is signed only with a temporary debug keystore generated during the workflow run.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Build & Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset:** \`${ASSET_NAME}\`"
              echo "- **GitHub Release Page:** ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "A backup copy is also available in the GitHub Actions workflow artifact named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$UPLOAD_OUTCOME" = "success" ]; then
              echo "::warning::GitHub Release publishing did not succeed (outcome: ${PUBLISH_OUTCOME}), but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
              {
                echo "## Debug APK Build Succeeded (Release Publishing Warning)"
                echo ""
                echo "> **Warning:** GitHub Release publishing failed or was skipped (\`${PUBLISH_OUTCOME}\`)."
                echo ""
                echo "- The debug APK build **succeeded**."
                echo "- Download the APK from the GitHub Actions artifact named \`app-debug-apk\` on this workflow run."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Debug APK build or artifact upload did not succeed (upload outcome: ${UPLOAD_OUTCOME}, release outcome: ${PUBLISH_OUTCOME})."
              {
                echo "## Debug APK Build Status"
                echo ""
                echo "- Artifact upload outcome: \`${UPLOAD_OUTCOME}\`"
                echo "- Release publish outcome: \`${PUBLISH_OUTCOME}\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
